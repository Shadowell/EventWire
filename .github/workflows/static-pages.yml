name: Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      engine:
        description: 发布执行位置；default 使用仓库 DEPLOY_ENGINE 变量
        type: choice
        options: [pages, server]
        default: server

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eventwire-deploy
  cancel-in-progress: false

env:
  DEPLOY_ENGINE: ${{ (github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server' }}

jobs:
  pages:
    name: GitHub Pages
    if: ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'pages'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  server:
    name: 自托管静态站点
    if: ((github.event_name == 'workflow_dispatch' && inputs.engine) || vars.DEPLOY_ENGINE || 'server') == 'server'
    runs-on: [self-hosted, linux, x64, project-eventwire, env-production, role-deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy static files to Tokyo
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          release="/opt/eventwire/releases/$sha"
          mkdir -p "$release" /opt/eventwire/deploy
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            ./ "$release/"
          ln -sfn "$release" /opt/eventwire/current.next
          mv -Tf /opt/eventwire/current.next /opt/eventwire/current
          printf '%s\n' "$sha" > /opt/eventwire/deploy/last_deployed_sha
          curl -fsS --max-time 5 http://127.0.0.1:3334/ >/dev/null
